# Smoke test for the upload-manifest Action. It exercises the EXACT committed artifact the Action
# ships — vendor/manifest-cli.mjs (the pre-built single-file CLI bundle, with manifest.schema.json
# vendored beside it) — with no runtime build and no live Dependra. Asserts: the committed bundle
# loads, validates a well-formed manifest with 0 issues, and produces a non-empty transport bundle;
# sync.mjs parses; and the sync unit tests pass.
#
# The CLI source lives in a separate repository; this repo only carries the built bundle under
# vendor/. Bundle freshness (rebuild-and-diff) is enforced there, not here.
#
# Schema provenance: the AUTHORITATIVE manifest schema is published at
# https://dependra.io/schema/manifest/v1/manifest.schema.json (generated by the backend from its own
# ingest mapper). vendor/manifest.schema.json is a point-in-time SNAPSHOT so the Action validates
# offline. The final two steps guard that snapshot, and the bundle beside it, against going stale —
# they are ENFORCING, not advisory. They were advisory once, and the snapshot silently fell five weeks
# and 19 properties behind the backend before anyone noticed.
name: Smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: validate a well-formed manifest via the committed bundle (expect 0 issues)
        run: |
          node --input-type=module -e '
            import { pathToFileURL } from "node:url";
            import { resolve } from "node:path";
            const cli = await import(pathToFileURL(resolve("vendor/manifest-cli.mjs")).href);
            for (const fn of ["runValidate", "runBundle"]) {
              if (typeof cli[fn] !== "function") { console.error(`bundle is missing ${fn}`); process.exit(1); }
            }
            const m = "test/fixtures/.dependra/manifest.yaml";
            const { issues } = cli.runValidate(m);
            const errs = issues.filter((i) => i.severity === "error");
            if (errs.length) { console.error("fixture unexpectedly has validation errors", errs); process.exit(1); }
            console.log("validate ok (committed bundle): issues", issues.length);
          '

      - name: bundle the manifest via the committed bundle (expect a well-formed transport bundle)
        run: |
          node --input-type=module -e '
            import { pathToFileURL } from "node:url";
            import { resolve } from "node:path";
            const cli = await import(pathToFileURL(resolve("vendor/manifest-cli.mjs")).href);
            const { bundle } = cli.runBundle("test/fixtures/.dependra/manifest.yaml");
            if (!bundle || typeof bundle !== "object") { console.error("bundle is not an object"); process.exit(1); }
            for (const k of ["manifest", "docs", "hashes"]) {
              if (!(k in bundle)) { console.error(`bundle missing "${k}"`); process.exit(1); }
            }
            if (Object.keys(bundle.manifest).length === 0) { console.error("bundle.manifest is empty"); process.exit(1); }
            if (!bundle.hashes.manifest) { console.error("bundle.hashes.manifest is empty"); process.exit(1); }
            console.log("bundle ok (committed bundle): manifest keys", Object.keys(bundle.manifest).length, "docs", Object.keys(bundle.docs).length);
          '

      - name: syntax-check the sync glue
        run: node --check sync.mjs

      - name: unit-test the sync bundle-to-wire transform
        run: node --test __tests__/transform.test.mjs

      - name: unit-test the sync OIDC exchange retry
        run: node --test __tests__/oidc-exchange.test.mjs

      # Drift gate on the SCHEMA half of vendor/. Compares MEANING, not bytes: both sides are parsed
      # and re-serialized with recursively sorted keys, so a CRLF checkout or a key-order change in
      # the generator cannot raise a false alarm.
      #
      # An unreachable URL is NOT a failure — this repo must not go red because dependra.io is down or
      # mid-deploy. A reachable URL that disagrees with the snapshot IS a failure. Note that the schema
      # emits no `additionalProperties: false` anywhere, so drift never REJECTS a valid manifest; it
      # just silently validates nothing about the newer fields. That is why it needs a gate rather than
      # a warning: nothing else will ever surface it.
      - name: vendored schema must match the published canonical schema
        env:
          CANONICAL_SCHEMA_URL: 'https://dependra.io/schema/manifest/v1/manifest.schema.json'
        run: |
          if ! curl -fsSL --max-time 30 "$CANONICAL_SCHEMA_URL" -o /tmp/published.schema.json; then
            echo "::notice::Could not fetch ${CANONICAL_SCHEMA_URL}; skipping the drift check (availability must not fail CI)."
            exit 0
          fi
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const canon = (v) =>
              Array.isArray(v) ? v.map(canon)
              : v && typeof v === "object"
                ? Object.fromEntries(Object.keys(v).sort().map((k) => [k, canon(v[k])]))
                : v;
            const read = (p) => JSON.stringify(canon(JSON.parse(readFileSync(p, "utf8"))));
            if (read("/tmp/published.schema.json") === read("vendor/manifest.schema.json")) {
              console.log("vendor/manifest.schema.json matches the published canonical schema.");
              process.exit(0);
            }
            console.error(
              "vendor/manifest.schema.json has DRIFTED from " + process.env.CANONICAL_SCHEMA_URL + ".\n" +
              "Refresh it from the CLI repo: `npm run copy-schema && npm run bundle`, then copy action-vendor/*\n" +
              "into this repo'"'"'s vendor/ and commit."
            );
            process.exit(1);
          '

      # Drift gate on the CODE half of vendor/. The schema can be checked against a canonical URL; the
      # bundle cannot, so bundle-vendor.mjs stamps the CLI version it was built from into the banner
      # and this compares it to the latest published `dependra` on npm.
      #
      # A version behind npm is genuinely transient during a release (npm publish lands before the
      # vendor copy is committed here) — but that window is exactly when this repo must be told, and
      # the fix is one documented copy. Registry unreachable, or no stamp (a bundle predating the
      # stamp), degrades to a notice rather than a false failure.
      - name: vendored bundle must be built from the published CLI version
        run: |
          # tr -d '\r' first: the bundle is authored on Windows, so a CRLF checkout would otherwise
          # leave a carriage return glued to the captured version and never match.
          stamped=$(tr -d '\r' < vendor/manifest-cli.mjs | sed -n 's|^// dependra-cli-version: \(.*\)$|\1|p' | head -n 1)
          if [ -z "$stamped" ]; then
            echo "::notice::vendor/manifest-cli.mjs carries no dependra-cli-version stamp (built before the stamp was added); skipping."
            exit 0
          fi
          if ! published=$(npm view dependra version 2>/dev/null) || [ -z "$published" ]; then
            echo "::notice::Could not reach the npm registry; skipping the bundle staleness check."
            exit 0
          fi
          if [ "$stamped" = "$published" ]; then
            echo "vendored bundle was built from dependra@${stamped} (current)."
            exit 0
          fi
          echo "vendor/manifest-cli.mjs was built from dependra@${stamped}, but dependra@${published} is published."
          echo "Rebuild in the CLI repo (\`npm run copy-schema && npm run bundle\`) and copy action-vendor/* into vendor/."
          exit 1
